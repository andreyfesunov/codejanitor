services:
  web.api:
    image: web.api
    build:
      context: .
      dockerfile: CodeJanitor.Web.API/Dockerfile
    ports:
      - 8080:8080
      - 8081:8081
    environment:
      ConnectionStrings__Default: ${DB_CONNECTION}

  postgres:
    image: postgres:17.6
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    